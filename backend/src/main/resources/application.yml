server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: zoro-academy-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zoro_academy}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${AWS_SES_HOST:}
    port: ${AWS_SES_PORT:587}
    username: ${AWS_SES_USERNAME:}
    password: ${AWS_SES_PASSWORD:}
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    provider: ${EMAIL_PROVIDER:}
    brevo-api-key: ${BREVO_API_KEY:}
    from-email: ${EMAIL_SENDER_EMAIL:${AWS_SES_FROM_EMAIL:zorocentre@gmail.com}}
    from-name: ${EMAIL_SENDER_NAME:${AWS_SES_FROM_NAME:Zoro English Academy}}
  storage:
    provider: ${APP_STORAGE_PROVIDER:bunny}
    bunny:
      host: ${BUNNY_STORAGE_HOST:storage.bunnycdn.com}
      zone: ${BUNNY_STORAGE_ZONE:}
      password: ${BUNNY_STORAGE_PASSWORD:${BUNNY_STORAGE_ACCESS_KEY:}}
      cdn-host: ${BUNNY_STORAGE_CDN_HOST:}

bunny:
  stream:
    library-id: ${BUNNY_STREAM_LIBRARY_ID:${BUNNY_LIBRARY_ID:}}
    api-key: ${BUNNY_STREAM_API_KEY:${BUNNY_API_KEY:}}
    cdn-host: ${BUNNY_STREAM_CDN_HOST:${BUNNY_CDN_HOST:}}
    token-auth-key: ${BUNNY_STREAM_TOKEN_AUTH_KEY:${BUNNY_TOKEN_AUTH_KEY:}}
    token-expiration-seconds: 7200
    webhook-secret: ${BUNNY_STREAM_WEBHOOK_SECRET:${BUNNY_WEBHOOK_SECRET:}}

admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}
  password-key: ${ADMIN_PASSWORD_KEY:zoroAcademyDevAdminPwdKey32B123}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  refresh-token-expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:7}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

schedule:
  resources-unlock-minutes: ${SCHEDULE_RESOURCES_UNLOCK_MINUTES:30}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

notifications:
  retention-days: 30

attendance:
  correction-window-minutes: ${ATTENDANCE_CORRECTION_WINDOW_MINUTES:60}
