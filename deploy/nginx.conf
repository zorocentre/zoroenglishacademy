# =============================================================================
# Zoro English Academy - Production Nginx Configuration (Nginx 1.28.3 on Ubuntu)
# File: /etc/nginx/sites-available/zoroenglish.com
# Symlink: /etc/nginx/sites-enabled/zoroenglish.com
# Test & Apply: sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# -----------------------------------------------------------------------------
# 1. HTTP -> HTTPS Redirects (Port 80)
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name zoroenglish.com www.zoroenglish.com api.zoroenglish.com;
    return 301 https://$host$request_uri;
}

# -----------------------------------------------------------------------------
# 2. WWW -> Apex Redirect (HTTPS)
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zoroenglish.com;

    ssl_certificate /etc/letsencrypt/live/zoroenglish.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zoroenglish.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://zoroenglish.com$request_uri;
}

# -----------------------------------------------------------------------------
# 3. Main Web Application: https://zoroenglish.com
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zoroenglish.com;

    # SSL Certificates (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/zoroenglish.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zoroenglish.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Document Root (Vite Production Build)
    root /var/www/zoroenglish.com/dist;
    index index.html;

    # Global upload body size & client timeout (allows media prompts, videos, PDFs up to 500M)
    client_max_body_size 500M;
    client_body_timeout 300s;
    client_header_timeout 60s;

    # Gzip Compression for Fast Frontend Asset Delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # Static Assets with Content Hashes (Vite /assets/*)
    # Must NOT fallback to /index.html if missing (=404)
    # -------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Public static files (favicon, logo, icons, share-modal script)
    location ~* \.(?:ico|png|jpg|jpeg|svg|webp|gif|js|css|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # API Reverse Proxy -> Spring Boot Backend (:8080)
    # CRITICAL: Placed strictly ABOVE the SPA fallback so /api/* routes,
    # uploads, and API 404s/403s are NEVER intercepted by index.html!
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;

        # Disable request buffering so large file/video uploads stream straight
        # to the backend without buffering the full 500MB payload on VPS disk first.
        proxy_request_buffering off;
        proxy_buffering off;

        # Upload & Long-running Request Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Reverse Proxy Headers (Required by Spring Boot ForwardedHeaderFilter)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # -------------------------------------------------------------------------
    # SPA Client-Side Routing Fallback (React Router / BrowserRouter)
    # All non-file browser navigation routes (/admin, /student/courses,
    # /competition/*, /trainer/*) fallback cleanly to /index.html.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# -----------------------------------------------------------------------------
# 4. Dedicated API Domain Virtual Host: https://api.zoroenglish.com
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.zoroenglish.com;

    ssl_certificate /etc/letsencrypt/live/api.zoroenglish.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zoroenglish.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 500M;
    client_body_timeout 300s;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Stream uploads directly to backend without buffering
        proxy_request_buffering off;
        proxy_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
